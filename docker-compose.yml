services:
  proxy:
    build: .
    container_name: claudette
    ports:
      - "127.0.0.1:5766:5766"
    volumes:
      # Claude credentials (read-only)
      - ~/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      - ~/.claude.json:/root/.claude.json:ro
      # Writable dirs for CLI runtime (cache, debug logs, telemetry)
      - claude-cache:/root/.claude/cache
      - claude-debug:/root/.claude/debug
      - claude-telemetry:/root/.claude/telemetry
    environment:
      - PORT=5766
    env_file:
      - .env
    restart: unless-stopped

volumes:
  claude-cache:
  claude-debug:
  claude-telemetry:
